
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050814">
<title>VOID ARENA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050814;color:white;font-family:system-ui,sans-serif;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;padding:12px}
.top{display:flex;justify-content:space-between;gap:8px}
.panel{background:#0a1838dd;border:1px solid #28708b;border-radius:12px;padding:9px 12px}
.label{font-size:10px;color:#83dff5;letter-spacing:2px}
.value{font-size:19px;font-weight:900}
#bars{margin-top:12px;width:min(260px,65%)}
.bar{height:9px;background:#18233b;border-radius:10px;overflow:hidden;margin:4px 0 8px}
.fill{height:100%;width:100%;transition:width .1s}
#hpFill{background:linear-gradient(90deg,#ff416e,#ff956b)}
#xpFill{background:linear-gradient(90deg,#25dfff,#a76aff)}
#pause{position:absolute;right:12px;top:105px;pointer-events:auto;border:1px solid #4383a4;border-radius:9px;background:#10213a;color:white;padding:8px 12px}
#stick{position:absolute;left:20px;bottom:25px;width:116px;height:116px;border-radius:50%;border:2px solid #4deaff66;background:#10284a99;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#4deaffaa;border:2px solid #b9faff;box-shadow:0 0 16px #00cfff77}
#dash{position:absolute;right:22px;bottom:35px;width:78px;height:78px;border-radius:50%;border:2px solid #ff70c4;background:#701c6199;color:white;font-weight:900;pointer-events:auto;touch-action:manipulation}
#message{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-weight:900;color:#9df7ff;text-shadow:0 0 15px #00dfff;white-space:nowrap}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#050814dd}
.card{width:min(420px,100%);padding:24px 20px;text-align:center;background:linear-gradient(145deg,#142343,#080e20);border:1px solid #367b9b;border-radius:20px;box-shadow:0 0 40px #00dfff1b}
.logo{font-size:42px;font-weight:1000;letter-spacing:5px;color:#e3fcff;text-shadow:0 0 20px #00cfff}
.subtitle{color:#4deaff;font-size:11px;letter-spacing:3px;margin:6px 0 22px}
.desc{color:#b7c9dc;font-size:13px;line-height:1.8;margin:12px 0 20px}
.primary,.secondary{width:100%;padding:14px;border-radius:11px;font-size:15px;font-weight:900;touch-action:manipulation}
.primary{background:linear-gradient(90deg,#4deaff,#83ffcf);border:0;color:#071222}
.secondary{background:#152641;border:1px solid #3c6787;color:white;margin-top:8px}
.hidden{display:none!important}
.choices{display:grid;gap:9px;margin-top:18px}
.choice{background:#102541;border:1px solid #4382a0;border-radius:10px;padding:12px;color:white;text-align:left;touch-action:manipulation}
.choice b{display:block;color:#72efff;margin-bottom:5px}
.choice span{font-size:12px;color:#c0d0df}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="top">
    <div class="panel"><div class="label">VOID ARENA</div><div class="value" id="time">00:00</div></div>
    <div class="panel"><div class="label">WAVE / LEVEL</div><div class="value"><span id="wave">1</span> / <span id="level">1</span></div></div>
  </div>
  <div id="bars">
    <div class="label">HP <span id="hpText">100 / 100</span></div>
    <div class="bar"><div id="hpFill" class="fill"></div></div>
    <div class="label">EXPERIENCE <span id="xpText">0 / 5</span></div>
    <div class="bar"><div id="xpFill" class="fill"></div></div>
  </div>
  <button id="pause">Ⅱ 일시정지</button>
  <div id="message"></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="dash">DASH</button>
</div>

<div class="overlay" id="startScreen">
  <div class="card">
    <div class="logo">VOID<br>ARENA</div>
    <div class="subtitle">NEON SURVIVAL</div>
    <p class="desc">적의 공격을 피하고 최대한 오래 생존하라.<br>이동 패드로 움직이면 자동으로 적을 공격해.<br>경험치를 모아 능력을 강화하고 보스를 물리쳐.</p>
    <button class="primary" id="start">게임 시작</button>
  </div>
</div>

<div class="overlay hidden" id="levelScreen">
  <div class="card">
    <div class="logo" style="font-size:30px">LEVEL UP</div>
    <p class="desc">강화할 능력을 하나 선택해.</p>
    <div class="choices" id="choices"></div>
  </div>
</div>

<div class="overlay hidden" id="pauseScreen">
  <div class="card">
    <div class="logo" style="font-size:32px">PAUSED</div>
    <p class="desc">전투가 일시정지되었어.</p>
    <button class="primary" id="resume">계속하기</button>
    <button class="secondary" id="restartPause">처음부터 다시</button>
  </div>
</div>

<div class="overlay hidden" id="overScreen">
  <div class="card">
    <div class="logo" style="font-size:34px">GAME OVER</div>
    <p class="desc" id="result"></p>
    <button class="primary" id="restart">다시 도전</button>
  </div>
</div>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);
const canvas=$("game");
const ctx=canvas.getContext("2d");

if(!ctx){
  alert("이 브라우저에서는 게임 화면을 실행할 수 없어.");
  return;
}

let W=innerWidth,H=innerHeight,DPR=1;
let state="menu",last=0,elapsed=0,spawnTimer=0,fireTimer=0;
let wave=1,kills=0,bossKills=0,shake=0,messageTimer=0;
let enemies=[],bullets=[],orbs=[],particles=[];
let moveX=0,moveY=0,keys={};

const player={
 x:0,y:0,r:12,hp:100,maxHp:100,speed:205,
 damage:18,fireRate:.5,range:330,level:1,xp:0,
 xpNeed:5,armor:0,magnet:80,dashTime:0,dashCd:0,shots:1
};

const upgrades=[
 {name:"플라즈마 강화",desc:"공격 피해량 25% 증가",apply(){player.damage*=1.25}},
 {name:"고속 냉각 코어",desc:"공격 속도 20% 증가",apply(){player.fireRate=Math.max(.16,player.fireRate*.8)}},
 {name:"이동 엔진",desc:"이동 속도 12% 증가",apply(){player.speed*=1.12}},
 {name:"나노 수복",desc:"체력 30 회복",apply(){player.hp=Math.min(player.maxHp,player.hp+30)}},
 {name:"확장 실드",desc:"최대 체력 25 증가 및 회복",apply(){player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+25)}},
 {name:"자기장 증폭",desc:"경험치 획득 범위 증가",apply(){player.magnet+=60}},
 {name:"장거리 조준",desc:"공격 사거리 20% 증가",apply(){player.range*=1.2}},
 {name:"분열 탄환",desc:"한 번에 발사하는 탄환 증가",apply(){player.shots=Math.min(3,player.shots+1)}},
 {name:"경량 장갑",desc:"받는 피해 15% 감소",apply(){player.armor=Math.min(.6,player.armor+.15)}},
 {name:"긴급 추진기",desc:"대시 대기시간 감소",apply(){player.dashCd=Math.max(.55,player.dashCd*.78)}}
];

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*DPR);
 canvas.height=Math.floor(H*DPR);
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(!player.x){player.x=W/2;player.y=H*.55;}
 player.x=Math.max(20,Math.min(W-20,player.x));
 player.y=Math.max(120,Math.min(H-25,player.y));
}
addEventListener("resize",resize);
resize();

function rand(a,b){return a+Math.random()*(b-a)}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function notify(text){
 $("message").textContent=text;
 messageTimer=1.2;
}
function overlaysOff(){
 ["startScreen","levelScreen","pauseScreen","overScreen"].forEach(id=>$(id).classList.add("hidden"));
}
function reset(){
 elapsed=0;spawnTimer=.5;fireTimer=.2;wave=1;kills=0;bossKills=0;shake=0;
 Object.assign(player,{
  x:W/2,y:H*.55,r:12,hp:100,maxHp:100,speed:205,
  damage:18,fireRate:.5,range:330,level:1,xp:0,
  xpNeed:5,armor:0,magnet:80,dashTime:0,dashCd:0,shots:1
 });
 enemies=[];bullets=[];orbs=[];particles=[];
 moveX=moveY=0;
 updateHUD();
}
function startGame(){
 reset();state="play";overlaysOff();notify("SURVIVE");
 last=performance.now();
}
function pauseGame(){
 if(state!=="play")return;
 state="pause";moveX=moveY=0;
 $("pauseScreen").classList.remove("hidden");
}
function resumeGame(){
 if(state!=="pause")return;
 state="play";$("pauseScreen").classList.add("hidden");
 last=performance.now();
}
function gameOver(){
 if(state==="over")return;
 state="over";
 $("result").textContent=
 "생존 시간 "+$("time").textContent+
 " · 처치 "+kills+" · 웨이브 "+wave+
 " · 보스 격파 "+bossKills;
 $("overScreen").classList.remove("hidden");
}

function spawnEnemy(){
 let side=Math.floor(Math.random()*4),x,y;
 if(side===0){x=rand(0,W);y=105;}
 if(side===1){x=W+15;y=rand(110,H);}
 if(side===2){x=rand(0,W);y=H+15;}
 if(side===3){x=-15;y=rand(110,H);}

 let boss=wave%5===0&&bossKills<Math.floor(wave/5);
 let roll=Math.random();
 let type=boss?"boss":roll<.22?"fast":roll<.42?"tank":"normal";
 let stats={
  normal:{r:10,hp:30+wave*4,speed:55+wave,damage:8,color:"#ff507e",xp:1},
  fast:{r:8,hp:20+wave*3,speed:95+wave,damage:6,color:"#ffb74d",xp:1},
  tank:{r:15,hp:90+wave*9,speed:34+wave*.5,damage:15,color:"#b76cff",xp:3},
  boss:{r:27,hp:450+wave*30,speed:28+wave*.4,damage:20,color:"#ff3fd0",xp:12}
 }[type];

 enemies.push({...stats,type,x,y,maxHp:stats.hp,hit:0,shoot:1.5});
 if(boss)notify("WARNING: BOSS");
}

function burst(x,y,color,count){
 for(let i=0;i<count;i++){
  let a=Math.random()*Math.PI*2,s=rand(30,130);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.2,.55),max:.55,color,r:rand(1,3)});
 }
}
function nearestEnemy(){
 let target=null,best=Infinity;
 for(const e of enemies){
  let d=distance(player,e);
  if(d<best&&d<player.range){best=d;target=e;}
 }
 return target;
}
function fire(){
 const target=nearestEnemy();
 if(!target)return;
 let a=Math.atan2(target.y-player.y,target.x-player.x);
 for(let i=0;i<player.shots;i++){
  let angle=a+(i-(player.shots-1)/2)*.16;
  bullets.push({
   x:player.x,y:player.y,
   vx:Math.cos(angle)*430,vy:Math.sin(angle)*430,
   r:4,damage:player.damage,color:"#62f5ff",life:1.2
  });
 }
}
function gainXP(n){
 player.xp+=n;
 if(player.xp>=player.xpNeed){
  player.xp-=player.xpNeed;
  player.level++;
  player.xpNeed=Math.ceil(player.xpNeed*1.3+2);
  levelUp();
 }
}
function levelUp(){
 state="level";
 const list=$("choices");
 list.innerHTML="";
 const pool=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);
 pool.forEach(u=>{
  const b=document.createElement("button");
  b.className="choice";
  b.innerHTML="<b>"+u.name+"</b><span>"+u.desc+"</span>";
  b.addEventListener("click",()=>{
   u.apply();
   $("levelScreen").classList.add("hidden");
   state="play";last=performance.now();
   notify(u.name);updateHUD();
  });
  list.appendChild(b);
 });
 $("levelScreen").classList.remove("hidden");
}

function updateHUD(){
 $("wave").textContent=wave;
 $("level").textContent=player.level;
 $("hpText").textContent=Math.ceil(player.hp)+" / "+player.maxHp;
 $("hpFill").style.width=(100*player.hp/player.maxHp)+"%";
 $("xpText").textContent=player.xp+" / "+player.xpNeed;
 $("xpFill").style.width=(100*player.xp/player.xpNeed)+"%";
 let sec=Math.floor(elapsed);
 $("time").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+
 String(sec%60).padStart(2,"0");
}

function update(dt){
 if(state!=="play")return;
 elapsed+=dt;
 spawnTimer-=dt;
 fireTimer-=dt;
 if(spawnTimer<=0){
  spawnEnemy();
  spawnTimer=Math.max(.25,1.05-wave*.035);
 }
 if(fireTimer<=0){fire();fireTimer=player.fireRate;}

 if(Math.floor(elapsed/25)+1>wave){
  wave=Math.floor(elapsed/25)+1;
  notify("WAVE "+wave);
 }

 if(player.dashCd>0)player.dashCd-=dt;
 if(player.dashTime>0)player.dashTime-=dt;

 let ix=moveX,iy=moveY;
 if(keys.ArrowLeft||keys.a)ix=-1;
 if(keys.ArrowRight||keys.d)ix=1;
 if(keys.ArrowUp||keys.w)iy=-1;
 if(keys.ArrowDown||keys.s)iy=1;
 let m=Math.hypot(ix,iy);
 if(m>1){ix/=m;iy/=m;}
 let speed=player.speed*(player.dashTime>0?2.8:1);
 player.x+=ix*speed*dt;
 player.y+=iy*speed*dt;
 player.x=Math.max(20,Math.min(W-20,player.x));
 player.y=Math.max(120,Math.min(H-25,player.y));

 for(let i=enemies.length-1;i>=0;i--){
  let e=enemies[i];
  let dx=player.x-e.x,dy=player.y-e.y;
  let d=Math.hypot(dx,dy)||1;
  e.x+=dx/d*e.speed*dt;
  e.y+=dy/d*e.speed*dt;
  e.hit=Math.max(0,e.hit-dt);

  if(d<e.r+player.r){
   player.hp-=e.damage*(1-player.armor)*dt;
   shake=2;
   if(player.hp<=0){player.hp=0;gameOver();break;}
  }

  if(e.type==="boss"){
   e.shoot-=dt;
   if(e.shoot<=0){
    e.shoot=1.8;
    let a=Math.atan2(player.y-e.y,player.x-e.x);
    for(let j=-1;j<=1;j++){
     let aa=a+j*.25;
     bullets.push({
      x:e.x,y:e.y,vx:Math.cos(aa)*155,vy:Math.sin(aa)*155,
      r:6,damage:10,color:"#ff68dd",life:3,enemy:true
     });
    }
   }
  }
 }

 for(let i=bullets.length-1;i>=0;i--){
  let b=bullets[i];
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(b.enemy){
   if(Math.hypot(player.x-b.x,player.y-b.y)<player.r+b.r){
    player.hp-=b.damage*(1-player.armor);
    burst(b.x,b.y,b.color,5);
    bullets.splice(i,1);continue;
   }
  }else{
   let hit=-1;
   for(let j=0;j<enemies.length;j++){
    let e=enemies[j];
    if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
     e.hp-=b.damage;e.hit=.08;hit=j;break;
    }
   }
   if(hit>=0){
    let e=enemies[hit];
    burst(b.x,b.y,b.color,3);
    bullets.splice(i,1);
    if(e.hp<=0){
     burst(e.x,e.y,e.color,e.type==="boss"?24:8);
     orbs.push({x:e.x,y:e.y,r:5,value:e.xp,color:"#6bffdf"});
     if(e.type==="boss"){bossKills++;notify("BOSS DEFEATED");}
     enemies.splice(hit,1);kills++;
    }
    continue;
   }
  }
  if(b.life<=0||b.x<-60||b.x>W+60||b.y<-60||b.y>H+60)
   bullets.splice(i,1);
 }

 for(let i=orbs.length-1;i>=0;i--){
  let o=orbs[i],d=distance(player,o);
  if(d<player.magnet+40){
   let speed=d<player.magnet?300:100;
   o.x+=(player.x-o.x)/(d||1)*speed*dt;
   o.y+=(player.y-o.y)/(d||1)*speed*dt;
  }
  if(d<player.r+o.r+4){
   let value=o.value;
   orbs.splice(i,1);
   gainXP(value);
  }
 }

 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vx*=.96;p.vy*=.96;p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }
 shake=Math.max(0,shake-dt*12);
 messageTimer-=dt;
 if(messageTimer<=0)$("message").textContent="";
 updateHUD();
}

function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 ctx.fillStyle="#050814";ctx.fillRect(0,0,W,H);
 let bg=ctx.createRadialGradient(W/2,H*.5,5,W/2,H*.5,Math.max(W,H)*.8);
 bg.addColorStop(0,"#11294d");bg.addColorStop(1,"#050814");
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 ctx.save();
 if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));

 const left=18,right=W-18,top=112,bottom=H-18;
 ctx.fillStyle="#07172b";
 ctx.fillRect(left,top,right-left,bottom-top);
 ctx.strokeStyle="#28ddff99";ctx.lineWidth=2;
 ctx.strokeRect(left,top,right-left,bottom-top);

 ctx.strokeStyle="#1b6a8a66";ctx.lineWidth=1;
 for(let x=left+30;x<right;x+=36){
  ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();
 }
 for(let y=top+30;y<bottom;y+=36){
  ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();
 }

 for(const o of orbs){
  ctx.save();ctx.shadowBlur=14;ctx.shadowColor=o.color;
  ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 for(const b of bullets){
  ctx.save();ctx.shadowBlur=12;ctx.shadowColor=b.color;
  ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 for(const e of enemies){
  ctx.save();ctx.shadowBlur=e.type==="boss"?22:12;ctx.shadowColor=e.color;
  ctx.fillStyle=e.hit>0?"white":e.color;
  if(e.type==="tank"||e.type==="boss"){
   let sides=e.type==="boss"?8:6;
   ctx.beginPath();
   for(let k=0;k<sides;k++){
    let a=k*Math.PI*2/sides+(e.type==="boss"?elapsed*.4:0);
    let x=e.x+Math.cos(a)*e.r,y=e.y+Math.sin(a)*e.r;
    if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   ctx.closePath();ctx.fill();
  }else{
   ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  if(e.type==="boss"||e.hp<e.maxHp){
   let bw=e.type==="boss"?66:30;
   ctx.fillStyle="#29182f";ctx.fillRect(e.x-bw/2,e.y-e.r-8,bw,4);
   ctx.fillStyle=e.color;ctx.fillRect(e.x-bw/2,e.y-e.r-8,bw*Math.max(0,e.hp/e.maxHp),4);
  }
 }

 ctx.save();
 ctx.shadowBlur=24;ctx.shadowColor="#4deaff";
 ctx.fillStyle="#4deaff44";ctx.beginPath();ctx.arc(player.x,player.y,player.r*2.1,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#e9fdff";ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#4deaff";ctx.lineWidth=3;ctx.stroke();ctx.restore();

 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/p.max);
  ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 ctx.restore();
}

function loop(now){
 const dt=Math.min(.033,Math.max(0,(now-last)/1000||0));
 last=now;
 update(dt);draw();
 requestAnimationFrame(loop);
}

function dash(){
 if(state!=="play"||player.dashCd>0)return;
 let x=moveX,y=moveY;
 if(Math.hypot(x,y)<.15)y=-1;
 let m=Math.hypot(x,y)||1;
 moveX=x/m;moveY=y/m;
 player.dashTime=.23;player.dashCd=1.6;
 burst(player.x,player.y,"#ff69d2",10);
}

const stick=$("stick"),knob=$("knob");
let pointerId=null;
function setStick(x,y){
 const r=stick.getBoundingClientRect();
 const dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2);
 const max=r.width*.34,m=Math.hypot(dx,dy)||1,k=Math.min(1,max/m);
 moveX=dx/m*k;moveY=dy/m*k;
 knob.style.transform=`translate(${moveX*max}px,${moveY*max}px)`;
}
function releaseStick(){
 pointerId=null;moveX=0;moveY=0;
 knob.style.transform="translate(0,0)";
}
stick.addEventListener("pointerdown",e=>{
 e.preventDefault();pointerId=e.pointerId;
 stick.setPointerCapture(e.pointerId);setStick(e.clientX,e.clientY);
});
stick.addEventListener("pointermove",e=>{
 if(pointerId===e.pointerId){e.preventDefault();setStick(e.clientX,e.clientY);}
});
stick.addEventListener("pointerup",e=>{if(pointerId===e.pointerId)releaseStick();});
stick.addEventListener("pointercancel",releaseStick);

let canvasPointer=null;
canvas.addEventListener("pointerdown",e=>{
 if(state!=="play")return;
 canvasPointer=e.pointerId;
 canvas.setPointerCapture(e.pointerId);
 setStick(e.clientX,e.clientY);
});
canvas.addEventListener("pointermove",e=>{
 if(canvasPointer===e.pointerId)setStick(e.clientX,e.clientY);
});
canvas.addEventListener("pointerup",e=>{
 if(canvasPointer===e.pointerId){canvasPointer=null;releaseStick();}
});
canvas.addEventListener("pointercancel",()=>{
 canvasPointer=null;releaseStick();
});

$("start").addEventListener("click",startGame);
$("dash").addEventListener("click",dash);
$("pause").addEventListener("click",pauseGame);
$("resume").addEventListener("click",resumeGame);
$("restartPause").addEventListener("click",startGame);
$("restart").addEventListener("click",startGame);

addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(e.key===" "){e.preventDefault();dash();}
 if(e.key==="Escape"||e.key.toLowerCase()==="p"){
  if(state==="play")pauseGame();else if(state==="pause")resumeGame();
 }
});
addEventListener("keyup",e=>{keys[e.key]=false;});
document.addEventListener("visibilitychange",()=>{
 if(document.hidden&&state==="play")pauseGame();
});

state="menu";
last=performance.now();
requestAnimationFrame(loop);
})();
</script>
